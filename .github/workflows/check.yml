name: Software Version Monitor
on:
  schedule:
    - cron: '0 0 * * 1-5'  # 평일 오전 9시 KST (UTC 0시 = KST 9시)
  workflow_dispatch:         # 수동 실행 버튼
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDR: ${{ secrets.EMAIL_ADDR }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECEIVER_ADDR: ${{ secrets.RECEIVER_ADDR }}
        run: |
          # 수동 실행이거나 UTC 00:00(KST 09:00)이면 정기 리포트 모드
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%H)" = "00" ]; then
            echo "📢 정기 리포트 모드로 실행합니다."
            python monitor.py --report
          else
            echo "🔍 업데이트 변동 사항을 체크합니다."
            python monitor.py
          fi
      - name: Commit and push if versions.json changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update versions and release dates" && git push)
